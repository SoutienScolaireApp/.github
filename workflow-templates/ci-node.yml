# Shared CI template: ci-node
# Node.js / TypeScript repositories with pnpm (backend, parent-web, admin-web).
#
# Copy this file to .github/workflows/ci.yml and fill the placeholders marked
# TODO(scaffold). Shape, rules and the Quality Gate contract: CI.md in
# SoutienScolaireApp/.github. Never rename the `quality-gate` job nor its name
# `Quality Gate`: it is the single required check of the protect-develop ruleset.
# A new job is added to the `needs:` list of `quality-gate`, nothing else.

name: CI

# No `edited` trigger by design: after editing the PR title or body, push a
# commit or re-run the `PR title and linked issue` job.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Tool versions: one place per template. Run-step downloads are not seen by
# Dependabot: bump them here by hand (ADR-014). Each *_SHA256 is the sha256
# of the linux amd64 release asset, pinned here and bumped with the version
# (never read from a checksum file of the same release).
env:
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
  OSV_SCANNER_VERSION: '2.7.0'
  OSV_SCANNER_SHA256: '160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b'
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '24.21.0'
  # Coverage floor of the test job, in percent of lines (spec §28): 80 for the
  # backend, 70 for the web apps (parent-web, admin-web).
  COVERAGE_MIN: '80'

jobs:
  pr-conventions:
    name: PR title and linked issue
    # GitHub-hosted until the self-hosted lanes exist (SoutienScolaireApp/infrastructure#12).
    # Future: runs-on: [self-hosted, Linux, X64, <lane>]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check the Conventional Commits title and the closing keyword
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Title and body are fetched live from the API and only ever held in
          # shell variables: never interpolated into the script (injection), and
          # a re-run sees a title edited after the last push.
          pr_json=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${REPO}/pulls/${PR_NUMBER}")
          title=$(jq -r '.title' <<<"$pr_json")
          body=$(jq -r '.body // ""' <<<"$pr_json")
          author=$(jq -r '.user.login' <<<"$pr_json")

          status=0
          title_re='^(feat|fix|refactor|chore|docs|test|perf|ci)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ "$title" =~ $title_re ]]; then
            echo "Title OK: $title"
          else
            echo "::error::PR title is not Conventional Commits: '<type>(<scope>): <description> (#<issue>)', type in feat|fix|refactor|chore|docs|test|perf|ci. Got: $title"
            status=1
          fi

          # Dependabot PRs have no issue: exempt from the issue suffix and the
          # closing keyword only.
          if [[ "$author" == "dependabot[bot]" ]]; then
            echo "Dependabot PR: issue suffix and closing keyword not required."
            exit "$status"
          fi

          suffix_re=' \(#[0-9]+\)$'
          if [[ "$title" =~ $suffix_re ]]; then
            echo "Issue suffix found."
          else
            echo "::error::PR title must end with its issue number: '<type>(<scope>): <description> (#<issue>)'."
            status=1
          fi

          # The issue must be in this repository: '#<n>', '<this repo>#<n>' or
          # its issues URL. A reference to another repository does not count.
          repo_re=${REPO//./\\.}
          closes_re="(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+((${repo_re})?#[0-9]+|https://github\.com/${repo_re}/issues/[0-9]+)([^[:alnum:]_/]|$)"
          if grep -Eiq "$closes_re" <<<"$body"; then
            echo "Closing keyword found."
          else
            echo "::error::The PR body must link an issue of ${REPO} with 'Closes #<n>' (or Fixes/Resolves, or 'Closes ${REPO}#<n>')."
            status=1
          fi
          exit "$status"

  gitleaks:
    name: Secrets (gitleaks)
    # GitHub-hosted until the self-hosted lanes exist (SoutienScolaireApp/infrastructure#12).
    # Future: runs-on: [self-hosted, Linux, X64, <lane>]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, sha256 verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$archive"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # A finding means the secret is already on GitHub: rotate it first, then
      # remove it from the branch (CI.md, ADR-014).
      - name: Scan the commits of the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --no-banner --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .

  actionlint:
    name: Workflows (actionlint)
    # GitHub-hosted until the self-hosted lanes exist (SoutienScolaireApp/infrastructure#12).
    # Future: runs-on: [self-hosted, Linux, X64, <lane>]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint (pinned, sha256 verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/$archive"
          echo "${ACTIONLINT_SHA256}  $archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # actionlint also runs shellcheck on `run:` scripts when shellcheck is on
      # the PATH (preinstalled on ubuntu-latest).
      - name: Lint the workflows
        run: actionlint -color

  lint-yaml-markdown:
    name: YAML and Markdown lint
    # GitHub-hosted until the self-hosted lanes exist (SoutienScolaireApp/infrastructure#12).
    # Future: runs-on: [self-hosted, Linux, X64, <lane>]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Require the lint configuration files
        run: |
          set -euo pipefail
          missing=0
          for f in .yamllint.yml .markdownlint-cli2.yaml \
            .github/lint/requirements.txt .github/lint/package.json .github/lint/package-lock.json; do
            if [[ ! -f "$f" ]]; then
              echo "::error::$f is missing: copy it from templates/lint/ in SoutienScolaireApp/.github (CI.md)."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # Lint tools come from .github/lint/: every package, transitive ones
      # included, is pinned with its hash (pip --require-hashes, npm ci with
      # the lockfile integrity). Bumped by Dependabot (pip, npm).
      - name: yamllint
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary :all: --no-deps -r .github/lint/requirements.txt
          yamllint --strict .

      # Installed outside the checkout, so no node_modules lands in the tree.
      - name: markdownlint
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/lint-node"
          mkdir -p "$tools"
          cp .github/lint/package.json .github/lint/package-lock.json "$tools/"
          npm ci --prefix "$tools" --ignore-scripts --no-audit --no-fund
          "$tools/node_modules/.bin/markdownlint-cli2"

  osv-scanner:
    name: Vulnerable dependencies (osv-scanner)
    # GitHub-hosted until the self-hosted lanes exist (SoutienScolaireApp/infrastructure#12).
    # Future: runs-on: [self-hosted, Linux, X64, <lane>]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install osv-scanner (pinned, sha256 verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          base="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
          binary="osv-scanner_linux_amd64"
          curl -fsSLO "$base/$binary"
          echo "${OSV_SCANNER_SHA256}  $binary" | sha256sum --check --strict -
          install -m 0755 "$binary" "$RUNNER_TEMP/bin/osv-scanner"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Blocks on high and critical only (CVSS >= 7.0); a finding without a
      # severity score blocks too. Moderate and low go through Dependabot
      # alerts. A finding with no fix is ignored only in osv-scanner.toml
      # ([[IgnoredVulns]] with reason and ignoreUntil), reviewed in the PR.
      - name: Scan the committed lockfiles
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/osv.json"
          rc=0
          osv-scanner scan source -r --format json --output-file "$report" . || rc=$?
          case "$rc" in
            0) echo "No known vulnerability."; exit 0 ;;
            1) ;;
            128) echo "::notice::No lockfile found: nothing to scan."; exit 0 ;;
            *) echo "::error::osv-scanner failed with exit code $rc (not a verdict): failing closed."; exit 1 ;;
          esac

          findings=$(jq -r '
            [ .results[]?.packages[]? | . as $p | .groups[]?
              | ((.max_severity // "") as $s | (try ($s | tonumber) catch -1)) as $score
              | {pkg: "\($p.package.ecosystem) \($p.package.name)@\($p.package.version)",
                 ids: (.ids | join(", ")), score: $score} ]' "$report")
          echo "All findings:"
          jq -r '.[] | "  \(.pkg): \(.ids) (CVSS \(if .score < 0 then "unknown" else .score end))"' <<<"$findings"

          blocking=$(jq '[.[] | select(.score < 0 or .score >= 7.0)] | length' <<<"$findings")
          if [[ "$blocking" -gt 0 ]]; then
            echo "::error::$blocking high, critical or unscored vulnerability group(s) found."
            exit 1
          fi
          echo "Only moderate or low findings: not blocking (tracked by Dependabot alerts)."

  # TODO(scaffold): the scripts `lint`, `typecheck`, `test:coverage` and `build`
  # are defined in package.json by the scaffold ticket; a missing script fails
  # the job (fail closed). pnpm's version comes from the `packageManager` field
  # of package.json: pin a pnpm major that Dependabot supports (pnpm@10.34.6
  # on 2026-10-15; GitHub documents v7 to v10).
  node:
    name: Node (format, lint, typecheck, test, build)
    # GitHub-hosted until the self-hosted lanes exist (SoutienScolaireApp/infrastructure#12).
    # Future: runs-on: [self-hosted, Linux, X64, node]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.head.repo.full_name == github.repository
    # ADR-013 Amendment 3, on every job that installs dependencies: any SSH
    # attempt fails closed (a missing rewrite cannot fall back to SSH), and a
    # URL that no rewrite matches fails fast instead of waiting for a prompt.
    env:
      GIT_SSH_COMMAND: "false"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # @usc/api-client is a git dependency on the private SoutienScolaireApp/contracts
      # (ADR-013 rules 5 and 9, Amendments 1 and 3; every ci-node repository
      # consumes it today). CI reads it with an installation token of the
      # GitHub App "SchoolEngine CI" (Contents: read, installed on contracts
      # only): organisation variable SCHOOLENGINE_CI_APP_CLIENT_ID, organisation
      # secret SCHOOLENGINE_CI_APP_PRIVATE_KEY (and a Dependabot secret of the
      # same name for Dependabot PRs). The two guards run before any token exists.
      - name: No installation token in tracked files
        run: |
          set -euo pipefail
          # Only file:line is printed, never the matching text (a leaked token).
          if git grep -nIE 'x-access-token:[A-Za-z0-9_]|ghs_[A-Za-z0-9]{20,}' | cut -d: -f1,2; then
            echo "::error::A tracked file holds a GitHub installation token: remove it and have the App key rotated (ADR-013)."
            exit 1
          fi

      # Positive allowlist of the @usc/api-client entry: the HTTPS form or the
      # SSH spelling Dependabot records, same commit, nothing else (CI.md,
      # "The contracts lockfile guard"). Copied from templates/contracts-lock/.
      - name: Contracts lockfile guard
        run: |
          set -euo pipefail
          guard=.github/scripts/check-contracts-lock.sh
          if [[ ! -f "$guard" ]]; then
            echo "::error::$guard is missing: copy it from templates/contracts-lock/ in SoutienScolaireApp/.github (CI.md)."
            exit 1
          fi
          sh "$guard" pnpm-lock.yaml package.json

      # The private key never enters a run step: only whether it is set.
      - name: Require the SchoolEngine CI App credentials
        env:
          APP_CLIENT_ID: ${{ vars.SCHOOLENGINE_CI_APP_CLIENT_ID }}
          HAS_PRIVATE_KEY: ${{ secrets.SCHOOLENGINE_CI_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          status=0
          if [[ -z "${APP_CLIENT_ID}" ]]; then
            echo "::error::The organisation variable SCHOOLENGINE_CI_APP_CLIENT_ID is empty or not shared with this repository: @usc/api-client (SoutienScolaireApp/contracts) cannot be fetched. See ADR-013 rule 9."
            status=1
          fi
          if [[ "${HAS_PRIVATE_KEY}" != 'true' ]]; then
            echo "::error::The organisation secret SCHOOLENGINE_CI_APP_PRIVATE_KEY is empty or not shared with this run (a Dependabot PR needs the Dependabot secret of the same name). See ADR-013 rule 9."
            status=1
          fi
          exit "$status"

      # Short-lived token (one hour at most), contents: read on contracts only,
      # revoked by the action's post step at job end.
      - name: Mint a read-only token for SoutienScolaireApp/contracts
        id: contracts-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.SCHOOLENGINE_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCHOOLENGINE_CI_APP_PRIVATE_KEY }}
          owner: SoutienScolaireApp
          repositories: contracts
          permission-contents: read

      # Both lockfile spellings of contracts are rewritten to the token URL, in
      # the env of this step only (never git config --global, never a file,
      # never a rewrite of git@github.com: as a whole); the action masks the
      # token, and SSH is never a transport (GIT_SSH_COMMAND above).
      # --ignore-scripts: no lifecycle script runs while the token is reachable.
      - name: Install (frozen lockfile, no scripts)
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.contracts-token.outputs.token }}@github.com/SoutienScolaireApp/contracts.git.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/SoutienScolaireApp/contracts.git
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ steps.contracts-token.outputs.token }}@github.com/SoutienScolaireApp/contracts.git.insteadOf
          GIT_CONFIG_VALUE_1: git@github.com:SoutienScolaireApp/contracts.git
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Prettier is blocking (spec §24). `format:check` is `prettier --check .`;
      # .prettierignore keeps *.md, *.yml and *.yaml out of it: yamllint and
      # markdownlint-cli2 govern them (CI.md, "Formatting").
      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # The test runner must write coverage/coverage-summary.json (Vitest:
      # coverage.reporter includes 'json-summary').
      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Coverage floor
        run: |
          set -euo pipefail
          summary=coverage/coverage-summary.json
          if [[ ! -f "$summary" ]]; then
            echo "::error::$summary not found: enable the json-summary coverage reporter."
            exit 1
          fi
          pct=$(jq -r '.total.lines.pct' "$summary")
          echo "Line coverage: ${pct} % (floor ${COVERAGE_MIN} %)"
          if ! awk -v p="$pct" -v m="$COVERAGE_MIN" 'BEGIN { exit !(p + 0 >= m + 0) }'; then
            echo "::error::Line coverage ${pct} % is below the floor of ${COVERAGE_MIN} %."
            exit 1
          fi

      - name: Build
        run: pnpm run build

  # The single required check. Its `if:` is exactly `!cancelled()` and nothing
  # else: a false condition skips the job and a skipped required check counts
  # as passing. No fork guard here on purpose: on a fork PR every job above is
  # skipped and this gate fails.
  quality-gate:
    name: Quality Gate
    # GitHub-hosted until the self-hosted lanes exist (SoutienScolaireApp/infrastructure#12).
    # Future: runs-on: [self-hosted, Linux, X64, <lane>]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [pr-conventions, gitleaks, actionlint, lint-yaml-markdown, osv-scanner, node]
    if: ${{ !cancelled() }}
    steps:
      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS_JSON"
          failed=$(jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")' <<<"$NEEDS_JSON")
          if [[ -n "$failed" ]]; then
            echo "::error::Quality Gate failed: not successful: $failed"
            exit 1
          fi
          echo "Quality Gate passed."
