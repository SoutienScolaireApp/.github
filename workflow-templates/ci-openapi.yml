# SchoolEngine CI template: ci-openapi
# OpenAPI contract repository (contracts): lint, breaking changes, generation drift.
#
# Copy this file to .github/workflows/ci.yml and fill the placeholders marked
# TODO(scaffold). Shape, rules and the Quality Gate contract: CI.md in
# SoutienScolaireApp/.github. Never rename the `quality-gate` job nor its name
# `Quality Gate`: it is the single required check of the protect-develop ruleset.
# A new job is added to the `needs:` list of `quality-gate`, nothing else.

name: CI

# No `edited` trigger by design: after editing the PR title or body, push a
# commit or re-run the `PR title and linked issue` job.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Tool versions: one place per template. Run-step downloads are not seen by
# Dependabot: bump them here by hand (ADR-014). Each *_SHA256 is the sha256
# of the linux amd64 release asset, pinned here and bumped with the version
# (never read from a checksum file of the same release).
env:
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
  OSV_SCANNER_VERSION: '2.7.0'
  OSV_SCANNER_SHA256: '160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b'
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '24.21.0'
  # Root of the assembled OpenAPI document (contracts: openapi/v1/openapi.yaml).
  OPENAPI_SPEC: 'openapi/v1/openapi.yaml'
  OASDIFF_VERSION: '1.33.0'
  OASDIFF_SHA256: '43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247'
  # Spectral standalone binary; sha256 = the GitHub release asset digest.
  SPECTRAL_VERSION: '6.16.3'
  SPECTRAL_SHA256: 'b90ac8da7b804d04052b9db8d4ea5028d29fba9bc69b02dc85d46e5fcc476452'

jobs:
  pr-conventions:
    name: PR title and linked issue
    # GitHub-hosted until the self-hosted lanes exist (SoutienScolaireApp/infrastructure#12).
    # Future: runs-on: [self-hosted, Linux, X64, <lane>]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check the Conventional Commits title and the closing keyword
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Title and body are fetched live from the API and only ever held in
          # shell variables: never interpolated into the script (injection), and
          # a re-run sees a title edited after the last push.
          pr_json=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${REPO}/pulls/${PR_NUMBER}")
          title=$(jq -r '.title' <<<"$pr_json")
          body=$(jq -r '.body // ""' <<<"$pr_json")
          author=$(jq -r '.user.login' <<<"$pr_json")

          status=0
          title_re='^(feat|fix|refactor|chore|docs|test|perf|ci)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ "$title" =~ $title_re ]]; then
            echo "Title OK: $title"
          else
            echo "::error::PR title is not Conventional Commits: '<type>(<scope>): <description> (#<issue>)', type in feat|fix|refactor|chore|docs|test|perf|ci. Got: $title"
            status=1
          fi

          # Dependabot PRs have no issue: exempt from the issue suffix and the
          # closing keyword only.
          if [[ "$author" == "dependabot[bot]" ]]; then
            echo "Dependabot PR: issue suffix and closing keyword not required."
            exit "$status"
          fi

          suffix_re=' \(#[0-9]+\)$'
          if [[ "$title" =~ $suffix_re ]]; then
            echo "Issue suffix found."
          else
            echo "::error::PR title must end with its issue number: '<type>(<scope>): <description> (#<issue>)'."
            status=1
          fi

          # The issue must be in this repository: '#<n>', '<this repo>#<n>' or
          # its issues URL. A reference to another repository does not count.
          repo_re=${REPO//./\\.}
          closes_re="(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+((${repo_re})?#[0-9]+|https://github\.com/${repo_re}/issues/[0-9]+)([^[:alnum:]_/]|$)"
          if grep -Eiq "$closes_re" <<<"$body"; then
            echo "Closing keyword found."
          else
            echo "::error::The PR body must link an issue of ${REPO} with 'Closes #<n>' (or Fixes/Resolves, or 'Closes ${REPO}#<n>')."
            status=1
          fi
          exit "$status"

  gitleaks:
    name: Secrets (gitleaks)
    # GitHub-hosted until the self-hosted lanes exist (SoutienScolaireApp/infrastructure#12).
    # Future: runs-on: [self-hosted, Linux, X64, <lane>]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, sha256 verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$archive"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # A finding means the secret is already on GitHub: rotate it first, then
      # remove it from the branch (CI.md, ADR-014).
      - name: Scan the commits of the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --no-banner --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .

  actionlint:
    name: Workflows (actionlint)
    # GitHub-hosted until the self-hosted lanes exist (SoutienScolaireApp/infrastructure#12).
    # Future: runs-on: [self-hosted, Linux, X64, <lane>]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint (pinned, sha256 verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/$archive"
          echo "${ACTIONLINT_SHA256}  $archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # actionlint also runs shellcheck on `run:` scripts when shellcheck is on
      # the PATH (preinstalled on ubuntu-latest).
      - name: Lint the workflows
        run: actionlint -color

  lint-yaml-markdown:
    name: YAML and Markdown lint
    # GitHub-hosted until the self-hosted lanes exist (SoutienScolaireApp/infrastructure#12).
    # Future: runs-on: [self-hosted, Linux, X64, <lane>]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Require the lint configuration files
        run: |
          set -euo pipefail
          missing=0
          for f in .yamllint.yml .markdownlint-cli2.yaml \
            .github/lint/requirements.txt .github/lint/package.json .github/lint/package-lock.json; do
            if [[ ! -f "$f" ]]; then
              echo "::error::$f is missing: copy it from templates/lint/ in SoutienScolaireApp/.github (CI.md)."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # Lint tools come from .github/lint/: every package, transitive ones
      # included, is pinned with its hash (pip --require-hashes, npm ci with
      # the lockfile integrity). Bumped by Dependabot (pip, npm).
      - name: yamllint
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary :all: --no-deps -r .github/lint/requirements.txt
          yamllint --strict .

      # Installed outside the checkout, so no node_modules lands in the tree.
      - name: markdownlint
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/lint-node"
          mkdir -p "$tools"
          cp .github/lint/package.json .github/lint/package-lock.json "$tools/"
          npm ci --prefix "$tools" --ignore-scripts --no-audit --no-fund
          "$tools/node_modules/.bin/markdownlint-cli2"

  osv-scanner:
    name: Vulnerable dependencies (osv-scanner)
    # GitHub-hosted until the self-hosted lanes exist (SoutienScolaireApp/infrastructure#12).
    # Future: runs-on: [self-hosted, Linux, X64, <lane>]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install osv-scanner (pinned, sha256 verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          base="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
          binary="osv-scanner_linux_amd64"
          curl -fsSLO "$base/$binary"
          echo "${OSV_SCANNER_SHA256}  $binary" | sha256sum --check --strict -
          install -m 0755 "$binary" "$RUNNER_TEMP/bin/osv-scanner"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Blocks on high and critical only (CVSS >= 7.0); a finding without a
      # severity score blocks too. Moderate and low go through Dependabot
      # alerts. A finding with no fix is ignored only in osv-scanner.toml
      # ([[IgnoredVulns]] with reason and ignoreUntil), reviewed in the PR.
      - name: Scan the committed lockfiles
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/osv.json"
          rc=0
          osv-scanner scan source -r --format json --output-file "$report" . || rc=$?
          case "$rc" in
            0) echo "No known vulnerability."; exit 0 ;;
            1) ;;
            128) echo "::notice::No lockfile found: nothing to scan."; exit 0 ;;
            *) echo "::error::osv-scanner failed with exit code $rc (not a verdict): failing closed."; exit 1 ;;
          esac

          findings=$(jq -r '
            [ .results[]?.packages[]? | . as $p | .groups[]?
              | ((.max_severity // "") as $s | (try ($s | tonumber) catch -1)) as $score
              | {pkg: "\($p.package.ecosystem) \($p.package.name)@\($p.package.version)",
                 ids: (.ids | join(", ")), score: $score} ]' "$report")
          echo "All findings:"
          jq -r '.[] | "  \(.pkg): \(.ids) (CVSS \(if .score < 0 then "unknown" else .score end))"' <<<"$findings"

          blocking=$(jq '[.[] | select(.score < 0 or .score >= 7.0)] | length' <<<"$findings")
          if [[ "$blocking" -gt 0 ]]; then
            echo "::error::$blocking high, critical or unscored vulnerability group(s) found."
            exit 1
          fi
          echo "Only moderate or low findings: not blocking (tracked by Dependabot alerts)."

  openapi-lint:
    name: OpenAPI lint (Spectral)
    # GitHub-hosted until the self-hosted lanes exist (SoutienScolaireApp/infrastructure#12).
    # Future: runs-on: [self-hosted, Linux, X64, node]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Spectral (pinned, sha256 verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/spectral" \
            "https://github.com/stoplightio/spectral/releases/download/v${SPECTRAL_VERSION}/spectral-linux-x64"
          echo "${SPECTRAL_SHA256}  $RUNNER_TEMP/bin/spectral" | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/bin/spectral"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Rule set: .spectral.yaml at the repository root, copied from
      # templates/openapi/.spectral.yaml (extends spectral:oas). Warnings block.
      - name: Lint the OpenAPI document
        run: |
          set -euo pipefail
          if [[ ! -f .spectral.yaml ]]; then
            echo "::error::.spectral.yaml is missing: copy it from templates/openapi/ in SoutienScolaireApp/.github."
            exit 1
          fi
          spectral --version
          spectral lint --ruleset .spectral.yaml --fail-severity=warn "$OPENAPI_SPEC"

  oasdiff:
    name: Breaking changes (oasdiff)
    # GitHub-hosted until the self-hosted lanes exist (SoutienScolaireApp/infrastructure#12).
    # Future: runs-on: [self-hosted, Linux, X64, node]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Full history and tags: the baseline is the latest v* release tag.
      - name: Checkout with history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install oasdiff (pinned, sha256 verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          base="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/$archive"
          echo "${OASDIFF_SHA256}  $archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" oasdiff
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Baseline (ADR-013 rule 4): the contract of the latest v* release tag,
      # or the base branch while no release exists. The document may be split
      # over several files ($ref): the whole top-level directory of
      # OPENAPI_SPEC is extracted from the baseline, not the root file alone.
      # A breaking change passes only with the `breaking-change-approved`
      # label (CONTRIBUTING.md). Adding the label needs a re-run of this job.
      - name: Compare with the baseline (latest v* tag, else the base branch)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          latest_tag=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [[ -n "$latest_tag" ]]; then
            ref="$latest_tag"
            echo "Baseline: latest release tag $latest_tag."
          else
            ref="$BASE_SHA"
            echo "::notice::No v* release tag yet: baseline is the base branch ($BASE_SHA)."
          fi
          if ! git cat-file -e "${ref}:${OPENAPI_SPEC}" 2>/dev/null; then
            echo "::notice::No $OPENAPI_SPEC in the baseline: first contract, nothing to compare."
            exit 0
          fi
          base_dir="$RUNNER_TEMP/base"
          mkdir -p "$base_dir"
          git archive "$ref" "${OPENAPI_SPEC%%/*}" | tar -x -C "$base_dir"

          # Exit codes: 0 = no ERR finding, 1 = ERR findings, other = the
          # comparison did not run (fail closed, never read as a verdict).
          rc=0
          oasdiff breaking "$base_dir/$OPENAPI_SPEC" "$OPENAPI_SPEC" --fail-on ERR || rc=$?
          if [[ "$rc" -eq 0 ]]; then
            echo "No breaking change against $ref."
            exit 0
          fi
          if [[ "$rc" -ne 1 ]]; then
            echo "::error::oasdiff exited $rc without a comparison: failing closed."
            exit 1
          fi

          labels=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${REPO}/pulls/${PR_NUMBER}" | jq -r '.labels[].name')
          if grep -qx 'breaking-change-approved' <<<"$labels"; then
            echo "::notice::Breaking change accepted through the breaking-change-approved label."
            exit 0
          fi
          echo "::error::Breaking change without the breaking-change-approved label (decision required, CONTRIBUTING.md)."
          exit 1

  generation-drift:
    name: Generated clients drift
    # GitHub-hosted until the self-hosted lanes exist (SoutienScolaireApp/infrastructure#12).
    # Future: runs-on: [self-hosted, Linux, X64, node]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # TODO(scaffold): `generate` regenerates the TypeScript and Dart clients
      # (ADR-013); add any toolchain it needs (Java, Dart) as steps above.
      - name: Regenerate the clients
        run: pnpm run generate

      - name: Fail on drift
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            git status --short
            git diff --stat
            echo "::error::Generated output differs from the committed files: run 'pnpm run generate' and commit the result."
            exit 1
          fi
          echo "Generated clients are up to date."

  # The single required check. Its `if:` is exactly `!cancelled()` and nothing
  # else: a false condition skips the job and a skipped required check counts
  # as passing. No fork guard here on purpose: on a fork PR every job above is
  # skipped and this gate fails.
  quality-gate:
    name: Quality Gate
    # GitHub-hosted until the self-hosted lanes exist (SoutienScolaireApp/infrastructure#12).
    # Future: runs-on: [self-hosted, Linux, X64, <lane>]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [pr-conventions, gitleaks, actionlint, lint-yaml-markdown, osv-scanner, openapi-lint, oasdiff, generation-drift]
    if: ${{ !cancelled() }}
    steps:
      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS_JSON"
          failed=$(jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")' <<<"$NEEDS_JSON")
          if [[ -n "$failed" ]]; then
            echo "::error::Quality Gate failed: not successful: $failed"
            exit 1
          fi
          echo "Quality Gate passed."
