# Weekly gitleaks scan of the whole git history, from
# workflow-templates/gitleaks-history.yml of SoutienScolaireApp/.github.
# Copied as is to .github/workflows/gitleaks-history.yml of every repository.
# The `gitleaks` job of ci.yml only scans the commits of a PR: this one also
# catches a secret pushed outside a PR, or a rule that gitleaks gained since.
# Run it by hand (Actions > Secrets history scan > Run workflow) before any
# mirror or migration of the repository (CI.md, ADR-014). A finding means the
# secret is compromised: rotate it first.

name: Secrets history scan

on:
  schedule:
    - cron: '0 5 * * 1'  # Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Same pins as the `gitleaks` job of ci.yml: bump both together (CI.md).
env:
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  gitleaks-history:
    name: Secrets in the whole history (gitleaks)
    # GitHub-hosted until the self-hosted lanes exist (SoutienScolaireApp/infrastructure#12).
    # Future: runs-on: [self-hosted, Linux, X64, <lane>]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth 0 fetches every branch and tag.
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, sha256 verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$archive"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Every commit reachable from any branch or tag. .gitleaksignore and
      # .gitleaks.toml of the default branch apply, as in ci.yml.
      - name: Scan the whole history
        run: gitleaks git --no-banner --redact --verbose --log-opts="--all" .
